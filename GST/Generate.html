<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generate Bill — Balu Tex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C97A;
    --dark: #0F0E0B;
    --surface: #1A1813;
    --surface2: #242018;
    --border: rgba(201,168,76,0.18);
    --text: #F0EAD6;
    --muted: #8A7F68;
    --danger: #c0392b;
  }
  body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .back-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s;
    text-decoration: none; display: inline-block;
  }
  .back-btn:hover { border-color: var(--gold); color: var(--gold); }
  .page-title {
    font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold-light);
  }
  .container { max-width: 560px; margin: 32px auto; padding: 0 20px 60px; }
  .section-label {
    font-size: 10px; letter-spacing: 2.5px; color: var(--muted); text-transform: uppercase;
    margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; margin-bottom: 20px;
  }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 7px;
  }
  input, select, textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; color: var(--text); font-size: 14px;
    font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--gold); }
  select { cursor: pointer; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .submit-btn {
    width: 100%; padding: 16px; background: var(--gold); color: #0F0E0B;
    border: none; border-radius: 12px; font-size: 15px; font-weight: 500;
    font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.5px; margin-top: 8px;
  }
  .submit-btn:hover { background: var(--gold-light); transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }
</style>
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="back-btn">← Home</a>
    <div class="page-title">Generate Invoice</div>
  </div>
  <div class="container">
    <div class="card">
      <div class="section-label">Customer</div>
      <div class="field">
        <label>Customer Name</label>
        <select id="customers"></select>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Invoice Details</div>
      <div class="row-2">
        <div class="field">
          <label>Invoice Number</label>
          <input class="invoice-no" type="number" placeholder="001">
        </div>
        <div class="field">
          <label>Invoice Date</label>
          <input class="invoice-date" type="date">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Item Details</div>
      <div class="row-2">
        <div class="field">
          <label>HSN Code</label>
          <input class="hsn" type="number" placeholder="5512">
        </div>
        <div class="field">
          <label>Rate (₹)</label>
          <input class="rate" type="number" placeholder="0.00">
        </div>
      </div>
      <div class="row-2">
        <div class="field">
          <label>Quantity</label>
          <input class="qty" type="number" placeholder="0.00">
        </div>
        <div class="field">
          <label>Amount (₹)</label>
          <input class="amt" type="number" placeholder="0.00">
        </div>
      </div>
      <div class="field">
        <label>GST %</label>
        <input class="gst" type="number" placeholder="5">
      </div>
    </div>

    <button class="submit-btn" onclick="submitBill()">Generate Invoice →</button>
  </div>

  <script src="data/customers.js"></script>
  <script>
    let html = '';
    customers.forEach((customer) => {
      const { to } = customer;
      html += `<option value="${to}">${to}</option>`;
    });
    document.querySelector('#customers').innerHTML = html;

    function submitBill() {
      const cus = document.querySelector('#customers').value;
      const no = document.querySelector('.invoice-no').value;
      const date = document.querySelector('.invoice-date').value;
      const hsn = document.querySelector('.hsn').value;
      const rate = document.querySelector('.rate').value;
      const qty = document.querySelector('.qty').value;
      const amt = document.querySelector('.amt').value;
      const gst = document.querySelector('.gst').value;
      if (!no || !date || !hsn || !rate || !qty || !amt || !gst) {
        alert('Please fill in all fields.');
        return;
      }
      const query = `?cus=${encodeURIComponent(cus)}&no=${no}&date=${date}&hsn=${hsn}&rate=${rate}&qty=${qty}&amt=${amt}&gst=${gst}`;
      window.location.href = 'GST.html' + query;
    }
  </script>
</body>
</html>
