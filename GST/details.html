<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Details — Balu Tex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C; --gold-light: #E8C97A; --dark: #0F0E0B;
    --surface: #1A1813; --surface2: #242018; --border: rgba(201,168,76,0.18);
    --text: #F0EAD6; --muted: #8A7F68;
  }
  body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .back-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s; text-decoration: none; display: inline-block;
  }
  .back-btn:hover { border-color: var(--gold); color: var(--gold); }
  .page-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold-light); }
  .count-badge {
    margin-left: auto; font-size: 12px; color: var(--muted);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px;
  }
  .container { max-width: 700px; margin: 28px auto; padding: 0 20px 60px; }
  .search-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 16px; color: var(--text);
    font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none;
    width: 100%; margin-bottom: 20px; transition: border-color 0.2s;
  }
  .search-bar:focus { border-color: var(--gold); }
  .customer-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 20px; margin-bottom: 12px;
    display: flex; gap: 16px; align-items: flex-start;
    transition: border-color 0.2s, transform 0.2s;
  }
  .customer-card:hover { border-color: rgba(201,168,76,0.4); transform: translateY(-1px); }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; background: var(--surface2);
    border: 1px solid var(--border); display: flex; align-items: center;
    justify-content: center; font-size: 16px; font-weight: 500; color: var(--gold);
    flex-shrink: 0; font-family: 'Playfair Display', serif;
  }
  .cus-name { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
  .cus-address { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 6px; }
  .cus-gst {
    display: inline-block; font-size: 11px; letter-spacing: 1px;
    color: var(--gold); background: rgba(201,168,76,0.08);
    border: 1px solid rgba(201,168,76,0.2); border-radius: 6px; padding: 2px 8px;
  }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; }
</style>
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="back-btn">← Home</a>
    <div class="page-title">வாடிக்கையாளர் விவரங்கள்</div>
    <div class="count-badge" id="count-badge"></div>
  </div>
  <div class="container">
    <input class="search-bar" type="text" placeholder="Search customers..." id="search" oninput="renderCards()">
    <div id="list"></div>
  </div>

  <script src="data/customers.js"></script>
  <script>
    let all = JSON.parse(localStorage.getItem('customers')) || customers || [];

    function getInitials(name) {
      return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
    }

    function renderCards() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = all.filter(c => c.to.toLowerCase().includes(q) || c.address.toLowerCase().includes(q));
      document.getElementById('count-badge').textContent = filtered.length + ' customers';
      if (!filtered.length) {
        document.getElementById('list').innerHTML = '<div class="empty">No customers found.</div>';
        return;
      }
      document.getElementById('list').innerHTML = filtered.map(c => `
        <div class="customer-card">
          <div class="avatar">${getInitials(c.to)}</div>
          <div>
            <div class="cus-name">${c.to}</div>
            <div class="cus-address">${c.address}</div>
            ${c.gst_no ? `<span class="cus-gst">${c.gst_no}</span>` : ''}
          </div>
        </div>
      `).join('');
    }
    renderCards();
  </script>
</body>
</html>
