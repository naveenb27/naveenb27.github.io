<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Customer — Balu Tex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C; --gold-light: #E8C97A; --dark: #0F0E0B;
    --surface: #1A1813; --surface2: #242018; --border: rgba(201,168,76,0.18);
    --text: #F0EAD6; --muted: #8A7F68; --danger: #c0392b; --danger-bg: rgba(192,57,43,0.08);
  }
  body { background: var(--dark); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .back-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s; text-decoration: none; display: inline-block;
  }
  .back-btn:hover { border-color: var(--gold); color: var(--gold); }
  .page-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--gold-light); }
  .container { max-width: 600px; margin: 28px auto; padding: 0 20px 60px; }
  .warning-bar {
    background: rgba(192,57,43,0.1); border: 1px solid rgba(192,57,43,0.25);
    border-radius: 10px; padding: 10px 16px; margin-bottom: 20px;
    font-size: 12px; color: #e88a80; letter-spacing: 0.3px;
  }
  .customer-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
    display: flex; gap: 14px; align-items: center; transition: border-color 0.2s;
  }
  .customer-card:hover { border-color: rgba(192,57,43,0.3); }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--surface2);
    border: 1px solid var(--border); display: flex; align-items: center;
    justify-content: center; font-size: 14px; font-weight: 500; color: var(--gold);
    flex-shrink: 0; font-family: 'Playfair Display', serif;
  }
  .cus-info { flex: 1; }
  .cus-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
  .cus-address { font-size: 11px; color: var(--muted); }
  .del-btn {
    background: var(--danger-bg); border: 1px solid rgba(192,57,43,0.3); color: #e88a80;
    border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 12px;
    font-family: 'DM Sans', sans-serif; transition: all 0.2s; white-space: nowrap;
  }
  .del-btn:hover { background: rgba(192,57,43,0.18); border-color: var(--danger); color: #f5a09a; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; }
</style>
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="back-btn">← Home</a>
    <div class="page-title">Delete Customer</div>
  </div>
  <div class="container">
    <div class="warning-bar">⚠ This action is permanent. Deleted customers cannot be recovered.</div>
    <div id="list"></div>
  </div>

  <script src="data/customers.js"></script>
  <script>
    let all = JSON.parse(localStorage.getItem('customers')) || customers || [];

    function getInitials(name) {
      return name.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
    }

    function render() {
      if (!all.length) {
        document.getElementById('list').innerHTML = '<div class="empty">No customers found.</div>';
        return;
      }
      document.getElementById('list').innerHTML = all.map((c, i) => `
        <div class="customer-card">
          <div class="avatar">${getInitials(c.to)}</div>
          <div class="cus-info">
            <div class="cus-name">${c.to}</div>
            <div class="cus-address">${c.address}</div>
          </div>
          <button class="del-btn" onclick="del(${i})">Delete</button>
        </div>
      `).join('');
    }

    function del(i) {
      if (!confirm('Delete "' + all[i].to + '"? This cannot be undone.')) return;
      all.splice(i, 1);
      localStorage.setItem('customers', JSON.stringify(all));
      render();
    }

    render();
  </script>
</body>
</html>
